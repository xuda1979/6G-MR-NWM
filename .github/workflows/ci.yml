name: Tests, benchmark smoke, and paper

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,paper,foundation]'
      - run: make lint test smoke planner-smoke
      - name: Re-evaluate committed checkpoints
        run: make verify
      - name: Regenerate tables and figures
        run: make report
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - run: make paper
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/main.pdf
